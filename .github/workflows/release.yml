name: Release

on:
  push:
    tags: ['v*']

jobs:
  release:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
            ext: tar.gz
          - os: macos-latest
            platform: darwin-arm64
            ext: tar.gz
          - os: windows-latest
            platform: win32-x64
            ext: zip

    steps:
      - uses: actions/checkout@v4

      - name: Build (POSIX)
        if: runner.os != 'Windows'
        run: sh scripts/build.sh

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install mingw -y --no-progress
          ./scripts/build.ps1

      - name: Verify version
        shell: pwsh
        run: |
          $jts = if ($env:RUNNER_OS -eq 'Windows') { 'bin/win32/jts.exe' } else { 'bin/linux/jts' }
          if ($env:RUNNER_OS -eq 'macOS') { $jts = 'bin/darwin/jts' }
          & $jts --version

      - name: Package (POSIX)
        if: runner.os != 'Windows'
        run: |
          tar -czf "jts-${{ matrix.platform }}.tar.gz" -C bin "${{ runner.os == 'macOS' && 'darwin' || 'linux' }}"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path bin/win32/*.exe -DestinationPath "jts-${{ matrix.platform }}.zip"

      - name: Upload asset
        uses: actions/upload-artifact@v4
        with:
          name: jts-${{ matrix.platform }}
          path: jts-${{ matrix.platform }}.${{ matrix.ext }}

  publish:
    name: Publish release
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: JTS GO ${{ github.ref_name }}
          body: |
            JTS GO ${{ github.ref_name }}

            Pre-built binaries for Windows, Linux and macOS.
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: assets/**/*
