name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Build (POSIX)
        if: runner.os != 'Windows'
        run: sh scripts/build.sh

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install mingw -y --no-progress
          ./scripts/build.ps1

      - name: Verify version
        shell: pwsh
        run: |
          $jts = if ($env:RUNNER_OS -eq 'Windows') { 'bin/win32/jts.exe' } else { 'bin/linux/jts' }
          if ($env:RUNNER_OS -eq 'macOS') { $jts = 'bin/darwin/jts' }
          & $jts --version

      - name: Run test suite
        shell: pwsh
        run: node scripts/test.js
